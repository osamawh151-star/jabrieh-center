<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الكفالات - جبرية سنتر</title>
    <style>
        :root {
            --primary-color: #d4af37;
            --dark-bg: #1a1a1a;
            --light-bg: #fdfbf7;
            --text-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid var(--primary-color);
        }
        #login-screen {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
            border-top: 5px solid var(--primary-color);
        }
        .logo-title {
            font-size: 24px;
            font-weight: bold;
            color: #222;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .hidden {
            display: none !important;
        }
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 5px;
        }
        .tab-btn {
            background: none;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 4px;
            color: #666;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: #000;
        }
        .warranty-header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .warranty-header h1 {
            font-size: 26px;
            color: #222;
        }
        .warranty-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .warranty-grid {
                grid-template-columns: 1fr;
            }
        }
        .terms-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
        }
        .signature-container {
            border: 1px dashed #999;
            border-radius: 6px;
            background: #fff;
            position: relative;
            margin-bottom: 20px;
        }
        canvas {
            display: block;
            touch-action: none;
            cursor: crosshair;
            width: 100%;
            height: 150px;
        }
        .sig-actions {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            background: #eee;
            font-size: 12px;
        }
        .sig-actions button {
            background: #d9534f;
            color: white;
            border: none;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .result-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .result-card h3 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }
        .user-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eee;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="logo-title">جبرية سنتر للإلكترونيات</div>
        <p style="margin-bottom: 20px; color: #666; font-size: 14px;">تسجيل دخول نظام الكفالات</p>
        <div class="form-group">
            <label>اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسم المستخدم">
        </div>
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور">
        </div>
        <button class="btn" onclick="login()">دخول</button>
        <p id="login-error" style="color: red; margin-top: 10px; font-size: 14px;" class="hidden"></p>
    </div>

    <div id="main-app" class="container hidden">
        <div class="user-info-bar">
            <span>مرحباً، <b>أسامة</b></span>
            <button onclick="logout()" style="background:#d9534f; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">خروج</button>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('add')">إضافة كفالة جديدة</button>
            <button class="tab-btn" onclick="switchTab('search')">بحث (الاسم أو السيريال)</button>
            <button class="tab-btn" onclick="switchTab('settings')">الإعدادات وتعديل الشروط</button>
        </div>

        <div id="tab-add">
            <div class="warranty-header">
                <h1 id="displayTitle">شهادة ضمان - WARRANTY</h1>
                <p style="font-size: 13px; color: #666; margin-top: 5px;" id="displaySubtitle">جبرية سنتر للإلكترونيات - بيت لحم</p>
            </div>

            <form id="warrantyForm" onsubmit="saveWarranty(event)">
                <div class="warranty-grid">
                    <div class="form-group">
                        <label>اسم الزبون:</label>
                        <input type="text" id="custName" required placeholder="اسم الزبون الثلاثي">
                    </div>
                    <div class="form-group">
                        <label>تاريخ الشراء:</label>
                        <input type="date" id="purchaseDate" required>
                    </div>
                    <div class="form-group">
                        <label>نوع الجهاز:</label>
                        <input type="text" id="deviceType" required placeholder="مثال: Samsung Galaxy">
                    </div>
                    <div class="form-group">
                        <label>البائع:</label>
                        <input type="text" id="sellerName" required placeholder="اسم الموظف البائع">
                    </div>
                    <div class="form-group">
                        <label>الرقم التسلسلي (السيريال):</label>
                        <input type="text" id="serialNo" required placeholder="IMEI أو الرقم التسلسلي">
                    </div>
                    <div class="form-group">
                        <label>مدة الضمان:</label>
                        <input type="text" id="warrantyPeriod" value="سنة واحدة" required>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>رقم الهاتف:</label>
                        <input type="tel" id="phoneNo" required placeholder="059xxxxxxx">
                    </div>
                </div>

                <div class="terms-box" id="displayTerms"></div>

                <div class="form-group">
                    <label>توقيع الزبون:</label>
                    <div class="signature-container">
                        <canvas id="sigCanvas"></canvas>
                        <div class="sig-actions">
                            <span>قم بالتوقيع داخل المربع أعلاه</span>
                            <button type="button" onclick="clearSignature()">مسح التوقيع</button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn">حفظ وطباعة شهادة الضمان</button>
            </form>
        </div>

        <div id="tab-search" class="hidden">
            <h3 style="margin-bottom: 15px;">بحث عن كفالة (باسم الزبون أو رقم السيريال فقط)</h3>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="اكتب اسم الزبون أو رقم السيريال للبحث..." oninput="searchWarranties()">
            </div>
            <div id="searchResults">
                <p style="color: #666; text-align: center;">ابدأ الكتابة للبحث عن الكفالات...</p>
            </div>
        </div>

        <div id="tab-settings" class="hidden">
            <h3 style="margin-bottom: 15px;">إعدادات البرنامج وتعديل الشروط</h3>
            <div class="form-group">
                <label>اسم المستخدم الحالي:</label>
                <input type="text" id="currentUsernameView" disabled style="background: #eee;">
            </div>
            <div class="form-group">
                <label>كلمة المرور الجديدة:</label>
                <input type="password" id="newPassword" placeholder="اتركها فارغة إذا لم ترد تغييرها">
            </div>
            <hr style="margin: 20px 0; border:0; border-top: 1px solid #ddd;">
            <div class="form-group">
                <label>تعديل شروط الكفالة:</label>
                <textarea id="editTerms" rows="8" style="font-size:14px; line-height:1.5;"></textarea>
            </div>
            <button class="btn" onclick="saveSettings()">حفظ التعديلات والإعدادات</button>
            <p id="settings-msg" style="color: green; margin-top: 10px; font-size: 14px;" class="hidden"></p>
        </div>
    </div>

    <script>
        const defaultTerms = `- الكفالة لا تشمل:
1. الكسر والحروق والسوائل حتى إن كان الجهاز مضاد للمياه.
2. وفي حال وجود كسر أو حرق أو سوائل أو خشين تلغي الكفالة فوراً.
3. سوء الاستخدام الجهاز واستعمال شاحن غير التأمين الأصلي.
4. خراب مدخل الشحن أو الشاحن ومرفقاته الجهاز.
5. إغلاق الجهاز على حساب الـ GMAIL أو الـ iCLOUD.
6. تعديل الجهاز بعد خروجه من المعرض نهائياً.

* تتم مسؤولية الكفالة على الشركة وليس على المعرض وتقتصر مسؤولية المعرض فقط لتوصيل الجهاز إلى الشركة للصيانة والمراجعة.
* يعتبر توقيع الزبون موافقة على جميع شروط الضمان المذكورة أعلاه.`;

        if (!localStorage.getItem('adminUser')) {
            localStorage.setItem('adminUser', 'admin');
            localStorage.setItem('adminPass', '123456');
        }
        if (!localStorage.getItem('warrantyTerms')) {
            localStorage.setItem('warrantyTerms', defaultTerms);
        }

        document.getElementById('currentUsernameView').value = localStorage.getItem('adminUser');
        document.getElementById('purchaseDate').valueAsDate = new Date();
        document.getElementById('editTerms').value = localStorage.getItem('warrantyTerms');
        document.getElementById('displayTerms').innerText = localStorage.getItem('warrantyTerms');

        function login() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let savedU = localStorage.getItem('adminUser');
            let savedP = localStorage.getItem('adminPass');

            if (u === savedU && p === savedP) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                initSignature();
            } else {
                let err = document.getElementById('login-error');
                err.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة!";
                err.classList.remove('hidden');
            }
        }

        function logout() {
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('password').value = '';
        }

        function switchTab(tabName) {
            document.getElementById('tab-add').classList.add('hidden');
            document.getElementById('tab-search').classList.add('hidden');
            document.getElementById('tab-settings').classList.add('hidden');

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            if (tabName === 'add') {
                document.getElementById('tab-add').classList.remove('hidden');
                event.target.classList.add('active');
                document.getElementById('displayTerms').innerText = localStorage.getItem('warrantyTerms');
                initSignature();
            } else if (tabName === 'search') {
                document.getElementById('tab-search').classList.remove('hidden');
                event.target.classList.add('active');
                searchWarranties();
            } else if (tabName === 'settings') {
                document.getElementById('tab-settings').classList.remove('hidden');
                event.target.classList.add('active');
                document.getElementById('editTerms').value = localStorage.getItem('warrantyTerms');
            }
        }

        function saveSettings() {
            let newP = document.getElementById('newPassword').value;
            if (newP.trim() !== '') {
                if (newP.length < 4) {
                    alert('كلمة المرور يجب أن تكون 4 أحرف أو أرقام على الأقل');
                    return;
                }
                localStorage.setItem('adminPass', newP);
            }

            let newTerms = document.getElementById('editTerms').value;
            localStorage.setItem('warrantyTerms', newTerms);
            document.getElementById('displayTerms').innerText = newTerms;

            let msg = document.getElementById('settings-msg');
            msg.textContent = "تم حفظ التعديلات وتحديث الشروط بنجاح!";
            msg.classList.remove('hidden');
            document.getElementById('newPassword').value = '';
        }

        let canvas, ctx, drawing = false;
        function initSignature() {
            setTimeout(() => {
                canvas = document.getElementById('sigCanvas');
                if (!canvas) return;
                ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth;
                canvas.height = 150;
                
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;

                canvas.onmousedown = startDraw;
                canvas.onmousemove = draw;
                canvas.onmouseup = stopDraw;
                canvas.onmouseleave = stopDraw;

                canvas.ontouchstart = (e) => { startDraw(e.touches[0]); e.preventDefault(); };
                canvas.ontouchmove = (e) => { draw(e.touches[0]); e.preventDefault(); };
                canvas.ontouchend = stopDraw;
            }, 200);
        }

        function getPos(e) {
            let rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX || e.pageX) - rect.left,
                y: (e.clientY || e.pageY) - rect.top
            };
        }

        function startDraw(e) {
            drawing = true;
            let pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!drawing) return;
            let pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDraw() {
            drawing = false;
        }

        function clearSignature() {
            if(ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function saveWarranty(e) {
            e.preventDefault();
            let warrantyData = {
                id: 'W-' + Date.now().toString().slice(-6),
                custName: document.getElementById('custName').value,
                purchaseDate: document.getElementById('purchaseDate').value,
                deviceType: document.getElementById('deviceType').value,
                sellerName: document.getElementById('sellerName').value,
                serialNo: document.getElementById('serialNo').value,
                warrantyPeriod: document.getElementById('warrantyPeriod').value,
                phoneNo: document.getElementById('phoneNo').value,
                terms: localStorage.getItem('warrantyTerms'),
                signature: canvas ? canvas.toDataURL() : '',
                createdAt: new Date().toLocaleDateString('ar-EG')
            };

            let warranties = JSON.parse(localStorage.getItem('warranties') || '[]');
            warranties.push(warrantyData);
            localStorage.setItem('warranties', JSON.stringify(warranties));

            alert('تم حفظ الكفالة بنجاح برقم: ' + warrantyData.id);
            document.getElementById('warrantyForm').reset();
            document.getElementById('purchaseDate').valueAsDate = new Date();
            clearSignature();
            printWarranty(warrantyData.id);
        }

        function searchWarranties() {
            let query = document.getElementById('searchInput').value.toLowerCase().trim();
            let warranties = JSON.parse(localStorage.getItem('warranties') || '[]');
            let resultsDiv = document.getElementById('searchResults');

            if (query === '') {
                resultsDiv.innerHTML = '<p style="color: #666; text-align: center;">ابدأ الكتابة للبحث عن الكفالات...</p>';
                return;
            }

            let filtered = warranties.filter(w => 
                w.custName.toLowerCase().includes(query) ||
                w.serialNo.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<p style="color: #666; text-align: center;">لا توجد نتائج مطابقة لـ (' + query + ').</p>';
                return;
            }

            let html = '';
            filtered.reverse().forEach(w => {
                html += `
                    <div class="result-card">
                        <h3>رقم الكفالة: ${w.id}</h3>
                        <p><b>اسم الزبون:</b> ${w.custName}</p>
                        <p><b>نوع الجهاز:</b> ${w.deviceType}</p>
                        <p><b>الرقم التسلسلي (السيريال):</b> ${w.serialNo}</p>
                        <p><b>رقم الهاتف:</b> ${w.phoneNo}</p>
                        <p><b>تاريخ الشراء:</b> ${w.purchaseDate} (المدة: ${w.warrantyPeriod})</p>
                        <p><b>البائع:</b> ${w.sellerName}</p>
                        <div style="margin-top: 10px;">
                            <button class="btn" style="padding: 5px 10px; font-size: 14px; width: auto;" onclick="printWarranty('${w.id}')">طباعة الشهادة</button>
                        </div>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
        }

        function printWarranty(id) {
            let warranties = JSON.parse(localStorage.getItem('warranties') || '[]');
            let w = warranties.find(item => item.id === id);
            if (!w) return;

            let printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html dir="rtl">
                <head>
                    <title>شهادة ضمان - ${w.id}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; background: #fdfbf7; color: #333; }
                        .box { border: 2px solid #d4af37; padding: 25px; border-radius: 10px; max-width: 700px; margin: auto; background: #fff; }
                        h1 { text-align: center; font-size: 24px; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
                        .grid { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 15px; }
                        .terms { font-size: 11px; line-height: 1.5; background: #f9f9f9; padding: 10px; margin-top: 15px; border: 1px solid #ddd; white-space: pre-line; }
                        .sig { margin-top: 20px; text-align: left; }
                        .sig img { max-width: 150px; border-bottom: 1px solid #000; }
                    </style>
                </head>
                <body>
                    <div class="box">
                        <h1>جبرية سنتر للإلكترونيات - شهادة ضمان</h1>
                        <p style="text-align:center; font-size:12px; color:#666;">رقم الكفالة: ${w.id}</p>
                        <br>
                        <div class="grid"><div><b>اسم الزبون:</b> ${w.custName}</div><div><b>تاريخ الشراء:</b> ${w.purchaseDate}</div></div>
                        <div class="grid"><div><b>نوع الجهاز:</b> ${w.deviceType}</div><div><b>البائع:</b> ${w.sellerName}</div></div>
                        <div class="grid"><div><b>الرقم التسلسلي:</b> ${w.serialNo}</div><div><b>مدة الضمان:</b> ${w.warrantyPeriod}</div></div>
                        <div class="grid"><div><b>رقم الهاتف:</b> ${w.phoneNo}</div><div></div></div>
                        
                        <div class="terms">
                            ${w.terms}
                        </div>

                        <div class="sig">
                            <p><b>توقيع الزبون:</b></p>
                            ${w.signature ? `<img src="${w.signature}">` : '<p>لا يوجد توقيع</p>'}
                        </div>
                    </div>
                    <script>window.print();<\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }
    </script>
</body>
</html>
